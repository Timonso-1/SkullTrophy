name: SkullTrophy
version: '${version}'
permissions:
  skulltrophy.admin:
    description: Allows use of /skulltrophy
    default: op
  skulltrophy.bypass:
    description: Players with this permission do not drop their head
    default: false
commands:
  skulltrophy:
    description: SkullTrophy admin command
    permission: skulltrophy.admin

main: de.timonso.skullTrophy.SkullTrophy
api-version: '26.3'
load: POSTWORLD

authors: [ Timonso ]
description: Players drop their head as a trophy when killed by another player. Configurable chance, name and lore.
